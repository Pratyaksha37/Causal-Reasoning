[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-causal-nlp"
version = "0.1.0"
description = "Neuro-Symbolic Causal Inference for Diabetes-Related Health Evidence"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "networkx>=3.2.1",
    "scikit-learn>=1.4.0",
    # Validated numerical stack uses NumPy 1.26; NumPy 2.x needs a clean-environment regression run.
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "spacy>=3.7.4",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "huggingface-hub>=0.21.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    # CPD persistence and inference are validated against this API; retest before upgrading.
    "pgmpy==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools.package-data]
"src.visualization" = ["assets/*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "spacy.*",
    "networkx.*",
    "transformers.*",
    "torch.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
