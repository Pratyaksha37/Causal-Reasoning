# Probabilistic modelling defaults: no implicit data downloads or added causal edges.
seed: 42
test_size: 0.2
paths:
  graph: results/graph/current/evidence_graph_after_repair.graphml
  provenance: results/graph/current/provenance.json
  annotation_queue: data/annotations/human_annotation_queue.jsonl
  output: results/modelling/brfss2015
model:
  mode: literature_prior
  variables: [BMICat, Outcome]
  exploratory_edges: []
  acknowledge_independence: false
estimation:
  method: bayesian
  equivalent_sample_size: 5.0
data:
  year: 2015
  profile: brfss_2015
  missing_policy: complete_case_model_variables
  age_boundaries: [18, 45, 65, 75, 81]
  outcome_definition: prediabetes_or_diabetes
# False defaults keep intervention outputs at model_simulation_only.
# These flags are assertions, never facts inferred from data or software tests.
# Single-query CLI flags can assert them explicitly; a justified experimental
# configuration may also assert them, with the assumptions recorded in results.
causal:
  # No unmeasured common causes in the supplied causal DAG.
  assume_causal_sufficiency: false
  # The hypothetical intervention corresponds to the measured exposure state.
  assume_consistency: false
  # Accept the supplied structural assumptions, not proof of real-world validity.
  acknowledge_structural_prior: false
